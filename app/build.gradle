plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.handvr.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.handvr.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // Reuse the exact model uploaded to the repository; no duplicate binary required.
    sourceSets {
        main.assets.srcDirs += ["../Assets/Plugins/Android/HandVRMediaPipe.androidlib/src/main/assets"]
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
